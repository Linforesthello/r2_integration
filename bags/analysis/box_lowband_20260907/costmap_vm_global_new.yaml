# VM A/B 对照 · 新版（09-06 修复 = 工作区 nav2_params_low global 结构，rolling 化）
# obstacle_layer scan-only + obstacle_low_layer velodyne_low mark-only 独立层
# scan clear 只清本层，碰不到 low 层已 mark 的 254
/costmap/costmap:
  ros__parameters:
    use_sim_time: False
    update_frequency: 2.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05
    footprint: "[[-0.42, -0.33], [-0.42, 0.33], [0.42, 0.33], [0.42, -0.33]]"
    plugins: ["obstacle_layer", "obstacle_low_layer", "inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.30
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: "scan"
      scan:
        topic: /scan
        data_type: "LaserScan"
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 8.0
        obstacle_min_range: 0.0
    obstacle_low_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: "velodyne_low"
      velodyne_low:
        topic: /velodyne_points
        data_type: "PointCloud2"
        min_obstacle_height: 0.0
        max_obstacle_height: 0.40
        marking: True
        clearing: False
        obstacle_max_range: 8.0
        obstacle_min_range: 0.0
        expected_update_rate: 10.0
    always_send_full_costmap: True
