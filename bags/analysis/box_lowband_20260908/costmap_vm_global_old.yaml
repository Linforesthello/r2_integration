# VM A/B 对照 · 旧版（修法 A 现状 = git HEAD nav2_params_low global 结构，rolling 化）
# 单 obstacle_layer 双源 scan+velodyne_low，均 clearing:True —— 复现 N97 近距 254 归零
/costmap/costmap:
  ros__parameters:
    use_sim_time: False
    update_frequency: 2.0
    publish_frequency: 2.0
    global_frame: odom
    robot_base_frame: base_link
    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05
    footprint: "[[-0.42, -0.33], [-0.42, 0.33], [0.42, 0.33], [0.42, -0.33]]"
    plugins: ["obstacle_layer", "inflation_layer"]
    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      cost_scaling_factor: 3.0
      inflation_radius: 0.30
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      enabled: True
      observation_sources: "scan velodyne_low"
      scan:
        topic: /scan
        data_type: "LaserScan"
        max_obstacle_height: 2.0
        clearing: True
        marking: True
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 8.0
        obstacle_min_range: 0.0
      velodyne_low:
        topic: /velodyne_points
        data_type: "PointCloud2"
        min_obstacle_height: 0.0
        max_obstacle_height: 0.40
        marking: True
        clearing: True
        raytrace_max_range: 8.0
        raytrace_min_range: 0.0
        obstacle_max_range: 8.0
        obstacle_min_range: 0.0
        expected_update_rate: 10.0
    always_send_full_costmap: True
