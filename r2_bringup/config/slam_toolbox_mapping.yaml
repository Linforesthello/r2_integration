# slam_toolbox 2D 建图参数（老车 S1：单 LD06 + explore_lite）
#
# 母本：/opt/ros/humble/share/slam_toolbox/config/mapper_params_online_async.yaml
#       （Humble 官方，整份复制，仅改动下表几项；其余保持官方默认以减少变量）
#
# 改动项（相对官方母本）：
#   base_frame            base_footprint → base_link    R2 TF 树已删 base_footprint
#   use_sim_time          新增 false                     官方 launch 默认 true，实车必须关
#   map_update_interval   5.0 → 2.0                      默认 5s 刷新太慢，explore 前沿会滞后
#   transform_publish_period 0.02 → 0.05                 map→odom 20Hz 足够，省 N97 CPU
#   enable_interactive_mode true → false                防 RViz 误拖位姿/地图
#
# 未改但需留意：
#   scan_topic /scan            必须与 LD06 实际发布话题一致（见 ld06.launch.py 的 topic 参数）
#   max_laser_range 20.0        LD06 消息 range_max 是驱动常量 25m，室内有效回波 ≤6.08m（11-07 实测）；
#                               本值只影响栅格化/匹配搜索范围，不截断输入数据。老车是否调小待实车评估（G11）
#
# 启动（官方 launch 的 use_sim_time 默认 true，必须显式覆盖）：
#   ros2 launch slam_toolbox online_async_launch.py \
#     slam_params_file:=$HOME/Lin_workspace/r2_integration/install/r2_bringup/share/r2_bringup/config/slam_toolbox_mapping.yaml \
#     use_sim_time:=false
slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_link          # 官方 base_footprint；R2 无该 frame，不改则不发布 map→odom
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                  # mapping | localization
    use_sim_time: false            # 实车；官方 launch 参数默认 true，启动时仍建议显式传 use_sim_time:=false

    # if you'd like to immediately start continuing a map at a given pose
    # or at the dock, but they are mutually exclusive, if pose is given
    # will use pose
    #map_file_name: test_steve
    # map_start_pose: [0.0, 0.0, 0.0]
    #map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05 # 官方 0.02（50Hz）；20Hz 足够
    map_update_interval: 2.0       # 官方 5.0；explore 前沿依赖 /map 刷新速度
    resolution: 0.05
    min_laser_range: 0.0 #for rastering images
    max_laser_range: 20.0 #for rastering images
    minimum_time_interval: 0.5     # 2Hz 处理 scan，省 N97 CPU（官方默认即 0.5）
    transform_timeout: 0.2
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: false # 官方 true；关掉 RViz 交互标记，防误拖

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
